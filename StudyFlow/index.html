<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyFlow – Organizador de Estudos</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts: DM Serif Display + DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ── HERO HEADER ─────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon" aria-hidden="true">✦</span>
        <h1 class="logo-title">StudyFlow</h1>
      </div>
      <p class="logo-tagline">seu ritmo, seu progresso</p>
    </div>

    <!-- Contador flutuante -->
    <div class="stats-bar" id="statsBar" aria-live="polite">
      <div class="stat">
        <span class="stat-number" id="totalCount">0</span>
        <span class="stat-label">tarefas</span>
      </div>
      <div class="stat-divider" aria-hidden="true"></div>
      <div class="stat">
        <span class="stat-number" id="doneCount">0</span>
        <span class="stat-label">concluídas</span>
      </div>
      <div class="stat-divider" aria-hidden="true"></div>
      <div class="stat">
        <span class="stat-number" id="pendingCount">0</span>
        <span class="stat-label">pendentes</span>
      </div>
    </div>
  </header>

  <!-- ── MAIN CONTENT ────────────────────────────────────────── -->
  <main class="main-content">

    <!-- Formulário de cadastro -->
    <section class="card form-card" aria-label="Adicionar nova tarefa">
      <div class="card-label">Nova tarefa</div>

      <div class="form-row">
        <div class="field">
          <label for="taskName">O que você vai estudar?</label>
          <input
            type="text"
            id="taskName"
            placeholder="ex: Revisão de Cálculo I"
            autocomplete="off"
            maxlength="80"
            aria-required="true"
          />
        </div>

        <div class="field field--small">
          <label for="taskSubject">Matéria</label>
          <input
            type="text"
            id="taskSubject"
            placeholder="ex: Matemática"
            autocomplete="off"
            maxlength="40"
          />
        </div>

        <button class="btn-add" id="btnAdd" aria-label="Adicionar tarefa">
          <span class="btn-icon" aria-hidden="true">+</span>
          Adicionar
        </button>
      </div>

      <!-- Mensagem de feedback / erro -->
      <div class="feedback" id="feedback" role="alert" aria-live="assertive"></div>
    </section>

    <!-- Filtros -->
    <div class="filters" role="group" aria-label="Filtrar tarefas">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="pending">Pendentes</button>
      <button class="filter-btn" data-filter="done">Concluídas</button>
    </div>

    <!-- Lista de tarefas -->
    <section aria-label="Lista de tarefas">
      <ul class="task-list" id="taskList" aria-live="polite"></ul>

      <!-- Estado vazio -->
      <div class="empty-state" id="emptyState" hidden>
        <span class="empty-icon" aria-hidden="true">◌</span>
        <p class="empty-title">Nenhuma tarefa aqui</p>
        <p class="empty-sub">Adicione uma tarefa acima para começar.</p>
      </div>
    </section>

  </main>

  <!-- ── FOOTER ──────────────────────────────────────────────── -->
  <footer class="site-footer">
    <p>StudyFlow &mdash; organize, foque, conquiste.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
